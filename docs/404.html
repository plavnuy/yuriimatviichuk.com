<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>404 — Yuriy Matviychuk. Artist. Designer.</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center;
			background: #faf9f7; color: #1c1b19; text-align: center; padding: 2rem;
			font: 400 .9375rem/1.6 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
		h1 { margin: 0 0 .75rem; font-size: clamp(2.25rem, 9vw, 3.5rem); font-weight: 600;
			letter-spacing: -.03em; line-height: 1; }
		p { margin: 0; color: #6b675f; }
		a { color: #8c5a3c; }
	</style>
</head>
<body>
	<main>
		<h1>404</h1>
		<p>This page does not exist. <a id="home" href="/">Go to the home page</a>.</p>
	</main>
	<script>
		// сайт может обслуживаться из подкаталога вида /yuram.com.ua/ — учитываем это
		var seg = location.pathname.split('/').filter(Boolean);
		if (seg[0] === 'yuram.com.ua') document.getElementById('home').href = '/yuram.com.ua/';
	</script>
</body>
</html>
